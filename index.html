<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111018" media="(prefers-color-scheme: dark)">
  <title>쉐도잉</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236246ea%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23a347d8%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff6b57%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-width%3D%222.6%22%20transform%3D%22translate%283.2%203.2%29%20scale%28.8%29%22%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.38%22%20transform%3D%22translate%282.4%202.4%29%22%3E%3Cpath%20d%3D%22M6%2013v6M11%209v14M16%205v22M21%2010v12M26%2013v6%22/%3E%3C/g%3E%3Cg%20stroke%3D%22%23fff%22%3E%3Cpath%20d%3D%22M6%2013v6M11%209v14M16%205v22M21%2010v12M26%2013v6%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
  <script>try{var t=localStorage.getItem("shadowing-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="home">
  <header class="site-header">
    <div class="wrap">
      <div class="nav-row">
        <div class="brand">
          <div class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke-linecap="round" stroke-width="3.2"><g stroke="#fff" stroke-opacity=".38" transform="translate(2.4 2.4)"><path d="M6 13v6M11 9v14M16 5v22M21 10v12M26 13v6"/></g><g stroke="#fff"><path d="M6 13v6M11 9v14M16 5v22M21 10v12M26 13v6"/></g></svg></div>
          <div class="brand-name">쉐도잉<small>Shadowing Studio</small></div>
        </div>
        <button type="button" class="btn theme-btn" id="theme-toggle" aria-label="화면 테마 바꾸기" title="라이트/다크 모드"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 14.6A8.6 8.6 0 0 1 9.4 3.3a8.6 8.6 0 1 0 11.3 11.3z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 2.8l2.1 2.1-1.4 1.4-2.1-2.1zm14.9 14.9 2.1 2.1-1.4 1.4-2.1-2.1zM2.8 19.8l2.1-2.1 1.4 1.4-2.1 2.1zM17.7 4.9l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg></button>
      </div>
      <p class="hero-eyebrow">영어 · 일본어 문장 따라 말하기</p>
      <h1>듣고, 따라 말하고,<br><em>내 문장으로 만들기</em></h1>
      <p class="lead">짧은 영상을 한 문장씩 반복해 듣고 그대로 따라 말해 보세요. 뜻과 표현, 단어도 문장마다 함께 정리돼 있어요.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="add-lesson" aria-labelledby="add-lesson-title">
      <h2 class="section-title" id="add-lesson-title">레슨 추가</h2>
      <form id="add-lesson-form" class="add-form">
        <label class="add-label" for="yt-url">유튜브 주소</label>
        <div class="add-row">
          <input id="yt-url" name="url" type="text" inputmode="url" autocomplete="url" required
                 placeholder="https://www.youtube.com/watch?v=..." aria-label="유튜브 주소">
          <button type="submit" class="btn primary" id="add-lesson-btn">레슨 추가</button>
        </div>
        <div class="add-lang-row">
          <label class="add-label" for="lesson-lang">언어</label>
          <select id="lesson-lang" name="lang" aria-label="레슨 언어">
            <option value="auto" selected>자동 감지 (영어/일본어)</option>
            <option value="en">영어</option>
            <option value="ja">일본어</option>
          </select>
        </div>
        <p class="add-hint">영어 또는 일본어 자막이 있는 영상을 넣으면 문장·한글 뜻·표현이 자동으로 만들어져 목록에 저장됩니다. 일본어는 읽기(후리가나·로마자)도 함께 표시됩니다.</p>
      </form>
      <div id="add-lesson-status" class="add-status" hidden role="status" aria-live="polite"></div>
    </section>

    <p id="pages-url-note" class="pages-note" hidden></p>

    <h2 class="section-title">레슨 목록</h2>
    <div id="lesson-list" class="lesson-grid" aria-live="polite">
      <p class="loading">레슨을 불러오는 중…</p>
    </div>
  </main>

  <script src="js/app.js?v=2"></script>
  <script>
  (function () {
    var b = document.getElementById("theme-toggle");
    if (!b) return;
    b.addEventListener("click", function () {
      var r = document.documentElement;
      var cur = r.getAttribute("data-theme") ||
        (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = cur === "dark" ? "light" : "dark";
      r.setAttribute("data-theme", next);
      try { localStorage.setItem("shadowing-theme", next); } catch (e) {}
    });
  })();
  </script>
</body>
</html>
