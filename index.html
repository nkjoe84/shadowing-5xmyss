<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1526">
  <title>영어 쉐도잉</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">Sh</div>
        <h1>영어 쉐도잉</h1>
      </div>
      <p class="lead">짧은 영상을 한 문장씩 듣고, 따라 말하며 익혀 보세요.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="add-lesson" aria-labelledby="add-lesson-title">
      <h2 class="section-title" id="add-lesson-title">레슨 추가</h2>
      <form id="add-lesson-form" class="add-form">
        <label class="add-label" for="yt-url">유튜브 주소</label>
        <div class="add-row">
          <input id="yt-url" name="url" type="text" inputmode="url" autocomplete="url" required
                 placeholder="https://www.youtube.com/watch?v=..." aria-label="유튜브 주소">
          <button type="submit" class="btn primary" id="add-lesson-btn">레슨 추가</button>
        </div>
        <p class="add-hint">영어 자막이 있는 영상을 넣으면 문장·한글 뜻·표현이 자동으로 만들어져 목록에 저장됩니다.</p>
      </form>
      <div id="add-lesson-status" class="add-status" hidden role="status" aria-live="polite"></div>
    </section>

    <p id="pages-url-note" class="pages-note" hidden></p>

    <h2 class="section-title">레슨 목록</h2>
    <div id="lesson-list" class="lesson-grid" aria-live="polite">
      <p class="loading">레슨을 불러오는 중…</p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
